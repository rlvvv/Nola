name: Build Nola (iOS)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodebuild -list -project Nola.xcodeproj

      # Catches every Swift/compile error. Unsigned because the CI Mac has no
      # signing identity; simulator/device builds without signing are fine here.
      - name: Build Release (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nola.xcodeproj \
            -scheme Nola \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify bundled Core Data model
        run: |
          MODEL_PATH="build/Build/Products/Release-iphoneos/Nola.app/Nola.momd/Nola.mom"
          test -f "$MODEL_PATH"
          swift -e '
            import CoreData
            import Foundation
            let url = URL(fileURLWithPath: CommandLine.arguments[1])
            guard let model = NSManagedObjectModel(contentsOf: url) else {
                fatalError("Could not load the compiled Nola Core Data model")
            }
            guard let entity = model.entitiesByName["JournalEntry"] else {
                fatalError("The compiled model has no JournalEntry entity")
            }
            let expected = Set(["id", "title", "content", "createdAt", "updatedAt", "entryType"])
            let actual = Set(entity.propertiesByName.keys)
            guard expected.isSubset(of: actual) else {
                fatalError("JournalEntry is missing expected attributes: \\(expected.subtracting(actual))")
            }
            print("Verified JournalEntry entity and attributes in Nola.mom")
          ' "$MODEL_PATH"

      # Package the built .app into an unsigned .ipa for SideStore.
      # SideStore signs it on-device with your Apple ID (personal team).
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Nola.app" Payload/
          zip -qry Nola-unsigned.ipa Payload
          ls -la

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nola-unsigned-ipa
          path: Nola-unsigned.ipa
