name: Build Nola (iOS)

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "sidestore.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nola-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodebuild -list -project Nola.xcodeproj

      # Catches every Swift/compile error. Unsigned because the CI Mac has no
      # signing identity; SideStore signs the IPA on-device with your Apple ID.
      - name: Build Release (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nola.xcodeproj \
            -scheme Nola \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify bundled Core Data model
        run: |
          MODEL_PATH="build/Build/Products/Release-iphoneos/Nola.app/Nola.momd/Nola.mom"
          test -f "$MODEL_PATH"
          swift -e '
            import CoreData
            import Foundation
            let url = URL(fileURLWithPath: CommandLine.arguments[1])
            guard let model = NSManagedObjectModel(contentsOf: url) else {
                fatalError("Could not load the compiled Nola Core Data model")
            }
            guard let entity = model.entitiesByName["JournalEntry"] else {
                fatalError("The compiled model has no JournalEntry entity")
            }
            let expected = Set(["id", "title", "content", "createdAt", "updatedAt", "entryType"])
            let actual = Set(entity.propertiesByName.keys)
            guard expected.isSubset(of: actual) else {
                fatalError("JournalEntry is missing expected attributes: \\(expected.subtracting(actual))")
            }
            guard let moodEntity = model.entitiesByName["MoodEntry"] else {
                fatalError("The compiled model has no MoodEntry entity")
            }
            let expectedMood = Set(["id", "date", "mood", "note"])
            let actualMood = Set(moodEntity.propertiesByName.keys)
            guard expectedMood.isSubset(of: actualMood) else {
                fatalError("MoodEntry is missing expected attributes: \\(expectedMood.subtracting(actualMood))")
            }
            guard let momentEntity = model.entitiesByName["MemorableMoment"] else {
                fatalError("The compiled model has no MemorableMoment entity")
            }
            let expectedMoment = Set(["id", "title", "content", "date"])
            let actualMoment = Set(momentEntity.propertiesByName.keys)
            guard expectedMoment.isSubset(of: actualMoment) else {
                fatalError("MemorableMoment is missing expected attributes: \\(expectedMoment.subtracting(actualMoment))")
            }
            print("Verified JournalEntry, MoodEntry, and MemorableMoment entities in Nola.mom")
          ' "$MODEL_PATH"

      # Give every build a monotonically increasing version so SideStore
      # reliably detects updates, even when the marketing version is unchanged.
      - name: Set automatic app version
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Nola.app"
          APP_VERSION="1.0.$GITHUB_RUN_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP_PATH/Info.plist"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"

      # Package the built .app into an unsigned .ipa for SideStore.
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Nola.app" Payload/
          zip -qry Nola-unsigned.ipa Payload
          echo "IPA_SIZE=$(stat -f%z Nola-unsigned.ipa)" >> "$GITHUB_ENV"
          ls -lh Nola-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nola-unsigned-ipa
          path: Nola-unsigned.ipa
          retention-days: 30

      # A public GitHub Release hosts the IPA so SideStore can download it.
      - name: Publish IPA release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sidestore-build-$GITHUB_RUN_ID"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" Nola-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nola $APP_VERSION" \
            --notes "Automated SideStore build from commit $GITHUB_SHA." \
            --prerelease

      # Keep one stable source URL. Every successful build replaces its latest
      # version entry with a link to that build's immutable GitHub Release asset.
      - name: Update SideStore source
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const branch = "sidestore";
            const path = "sidestore.json";
            const sourceURL = `https://raw.githubusercontent.com/${owner}/${repo}/sidestore/sidestore.json`;
            const releaseURL = `https://github.com/${owner}/${repo}/releases/download/${process.env.RELEASE_TAG}/Nola-unsigned.ipa`;
            const source = {
              name: "Nola",
              identifier: "io.lvnt.nola.sidestore",
              sourceURL,
              apps: [{
                name: "Nola",
                bundleIdentifier: "com.example.Nola",
                developerName: "lvnt",
                subtitle: "A personal AI journal",
                localizedDescription: "A personal AI journal for writing entries, tracking moods, saving memorable moments, and having thoughtful Companion conversations.",
                iconURL: `https://raw.githubusercontent.com/${owner}/${repo}/sidestore/Nola/Resources/Assets.xcassets/AppIcon.appiconset/Nola-Black.png`,
                tintColor: "#252525",
                versions: [{
                  version: process.env.APP_VERSION,
                  date: new Date().toISOString().slice(0, 10),
                  localizedDescription: `Automated build ${process.env.APP_VERSION}.`,
                  downloadURL: releaseURL,
                  size: Number(process.env.IPA_SIZE),
                  minOSVersion: "15.0"
                }]
              }]
            };
            const content = Buffer.from(JSON.stringify(source, null, 2)).toString("base64");
            const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `Publish Nola ${process.env.APP_VERSION} to SideStore`,
              sha: existing.data.sha,
              content
            });
            core.info(`Published SideStore feed: ${sourceURL}`);
